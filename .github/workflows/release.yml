name: Build and package release build

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:

jobs:
  package:
    name: Build and package release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8"

      - name: Get BizHawk version
        run: echo "BIZHAWK_VERSION=$(grep -Po "MainVersion = \"\K(.*)(?=\")" src/BizHawk.Common/VersionInfo.cs)" >> $GITHUB_ENV

      - name: Update version info
        run: Dist/UpdateVersionInfoForRelease.sh

      - name: Install Linux speech build dependencies and Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14 pkg-config libglibmm-2.68-dev libspeechd-dev mono-complete libatk-bridge2.0-dev python3 python3-gi gir1.2-atspi-2.0 xvfb libxtst6 dbus-x11 patch libsdl2-2.0-0 libopenal1 liblua5.4-0 libgdiplus libgtk-3-0 fonts-dejavu-core

      - name: Build Linux speech library
        env:
          CXX: g++-14
        run: Dist/BuildPrism.sh

      - name: Build Linux menu accessibility
        run: Dist/BuildLinuxAccessibility.sh

      - name: Build solution
        run: Dist/BuildRelease.sh

      - name: Check Linux menus through AT-SPI
        run: Dist/TestLinuxAccessibility.sh

      - name: Package (Linux)
        run: Dist/Package.sh
      - name: Package into .tar.gz
        run: |
          tar -czf BizHawk-${{ env.BIZHAWK_VERSION }}-linux-x64.tar.gz --owner=0 --group=0 -C packaged_output .

      - name: Package (Windows)
        run: Dist/Package.sh windows-x64
      - name: Package into .zip
        working-directory: packaged_output
        run: zip -r ../BizHawk-${{ env.BIZHAWK_VERSION }}-win-x64.zip .

      - name: Upload release builds
        uses: actions/upload-artifact@v7
        with:
          name: BizHawk-${{ env.BIZHAWK_VERSION }}-release
          path: |
            BizHawk-${{ env.BIZHAWK_VERSION }}-linux-x64.tar.gz
            BizHawk-${{ env.BIZHAWK_VERSION }}-win-x64.zip
